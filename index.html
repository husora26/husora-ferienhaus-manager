<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>Husora — Ferienhaus-Manager</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26342e;
      --muted: #77817a;
      --line: #e6e6dc;
      --paper: #fffefa;
      --canvas: #f5f3eb;
      --green: #315d49;
      --green-dark: #244a39;
      --green-soft: #e8efe8;
      --amber: #a87539;
      --amber-soft: #f8f0e2;
      --red: #a94e44;
      --red-soft: #f9eae7;
      --shadow: 0 10px 34px rgba(35, 48, 39, .045);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: radial-gradient(ellipse at 88% 0%, rgba(229, 236, 225, .52), transparent 34%), var(--canvas); color: var(--ink); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; }
    .nav-menu-wrap { position: fixed; bottom: 20px; left: 50%; z-index: 20; transform: translateX(-50%); }
    .icon-btn.menu-toggle svg { width: 21px; height: 21px; }
    .icon-btn.menu-toggle { width: 56px; height: 56px; border: 2px solid white; border-radius: 50%; color: white; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft), 0 7px 22px rgba(35,48,39,.32); transition: background .16s ease, box-shadow .16s ease, transform .16s ease; }
    .icon-btn.menu-toggle:hover { background: var(--green-dark); box-shadow: 0 0 0 4px #dbe8dd, 0 9px 26px rgba(35,48,39,.36); transform: translateY(-2px); }
    .icon-btn.menu-toggle:focus-visible { outline: 3px solid var(--amber); outline-offset: 5px; }
    .nav-menu { position: absolute; bottom: calc(100% + 10px); left: 50%; z-index: 20; display: none; width: min(290px, calc(100vw - 26px)); padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: 0 16px 42px rgba(35,48,39,.16); transform: translateX(-50%); }
    .nav-menu.open { display: block; }
    .nav-menu-label { margin: 4px 10px 9px; color: #8a938c; font-size: 10px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; }
    .nav { display: grid; gap: 4px; }
    .nav button {
      display: flex; align-items: center; gap: 13px; width: 100%; padding: 11px 13px; border: 0;
      border-radius: 9px; color: #727a74; background: transparent; text-align: left; font-size: 13px; font-weight: 550;
    }
    .nav button:hover { color: var(--green); background: #f6f8f5; }
    .nav button.active { color: var(--green); background: var(--green-soft); font-weight: 700; }
    .nav svg { width: 17px; height: 17px; flex: none; }
    .nav-count { margin-left: auto; padding: 2px 7px; border-radius: 20px; color: #fff; background: var(--green); font-size: 10px; }
    main { max-width: 1510px; min-height: 100vh; margin: 0 auto; padding: 0 46px 50px; }
    .topbar { position: sticky; top: 0; z-index: 30; isolation: isolate; display: flex; align-items: center; justify-content: space-between; width: 100vw; height: 82px; margin-left: calc(50% - 50vw); padding: 0 max(46px, calc((100vw - 1418px) / 2)); border-bottom: 1px solid var(--line); background: #000; }
    .topbar::before { position: absolute; inset: 0; z-index: -1; background: url("assets/schweden-landschaft.jpg") center 48% / cover no-repeat; content: ""; opacity: .6; }
    .breadcrumb { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
    .breadcrumb-home { display: grid; place-items: center; width: 31px; height: 31px; flex: none; padding: 0; border: 1px solid transparent; border-radius: 8px; background: transparent; }
    .breadcrumb-home:hover, .breadcrumb-home:focus-visible { border-color: var(--line); background: rgba(255,254,250,.8); outline: none; }
    .breadcrumb-home svg { width: 23px; height: 23px; }
    .breadcrumb-brand { color: white; font-size: 24px; font-weight: 850; letter-spacing: 1px; }
    .breadcrumb-separator, .breadcrumb #breadcrumb { display: none; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .notification-wrap { position: relative; }
    .notification-panel { position: absolute; top: calc(100% + 10px); right: 0; z-index: 31; display: none; width: min(360px, calc(100vw - 26px)); max-height: min(70vh, 480px); overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: 0 16px 42px rgba(35,48,39,.16); }
    .notification-panel.open { display: block; }
    .notification-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 17px 12px; border-bottom: 1px solid var(--line); }
    .notification-head strong { display: block; font-size: 12px; }
    .notification-head small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .notification-count { flex: none; padding: 4px 7px; border-radius: 12px; color: var(--red); background: var(--red-soft); font-size: 9px; font-weight: 700; }
    .notification-list { padding: 0 14px; }
    .notification-list .task-row { min-height: 62px; gap: 9px; }
    .notification-list .task-name { font-size: 11px; }
    .notification-list .task-due { min-width: 58px; font-size: 9px; }
    .notification-footer { display: flex; justify-content: flex-end; padding: 9px 17px 13px; border-top: 1px solid var(--line); }
    .dot[hidden] { display: none; }
    .icon-btn { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 10px; color: #59635b; background: white; }
    .icon-btn svg { width: 16px; height: 16px; }
    .dot { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border: 1px solid white; border-radius: 50%; background: #d18b43; }
    .page { padding-top: 31px; }
    .welcome { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font-size: 10px; font-weight: 750; letter-spacing: 1.2px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(25px, 3vw, 32px); letter-spacing: -1.1px; line-height: 1.15; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .primary-btn, .secondary-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 39px; padding: 0 14px;
      border: 1px solid transparent; border-radius: 8px; font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .primary-btn { color: white; background: var(--green); }
    .primary-btn:hover { background: var(--green-dark); }
    .secondary-btn { border-color: var(--line); color: #49544c; background: white; }
    .primary-btn svg, .secondary-btn svg { width: 15px; height: 15px; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 21px; }
    .stat, .card { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: var(--shadow); }
    .stat { position: relative; isolation: isolate; min-height: 120px; overflow: hidden; padding: 17px 18px; }
    button.stat { width: 100%; color: inherit; text-align: left; }
    .stat[data-page] { cursor: pointer; transition: transform .16s ease, box-shadow .16s ease; }
    .stat[data-page]:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(35,48,39,.09); }
    .stat > :not(.stat-art) { position: relative; z-index: 1; }
    .stat-art { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; opacity: .2; pointer-events: none; }
    .stat-head { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .stat-icon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: var(--green); background: var(--green-soft); }
    button.stat-icon { padding: 0; border: 0; cursor: pointer; }
    button.stat-icon:hover, button.stat-icon:focus-visible { outline: 2px solid #9db9a5; outline-offset: 2px; }
    .stat-icon.amber { color: var(--amber); background: var(--amber-soft); }
    .stat-icon svg { width: 15px; height: 15px; }
    .stat-value { margin-top: 13px; font-size: 26px; font-weight: 730; letter-spacing: -.8px; }
    .stat-note { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .stat-note em { color: var(--green); font-style: normal; font-weight: 700; }
    .columns { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, .9fr); align-items: start; gap: 17px; }
    .card { overflow: hidden; }
    .card + .card { margin-top: 17px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 19px; border-bottom: 1px solid var(--line); }
    .card-title { margin: 0; font-size: 13px; font-weight: 720; }
    .card-caption { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .text-btn { padding: 4px 0; border: 0; color: var(--green); background: none; font-size: 11px; font-weight: 700; }
    .task-list { padding: 0 19px; }
    .task-row { display: flex; align-items: center; gap: 12px; min-height: 67px; border-bottom: 1px solid #f0f1ee; }
    .task-row[data-edit-task] { cursor: pointer; }
    .task-row[data-edit-task]:hover .task-name { color: var(--green); }
    .task-row:last-child { border-bottom: 0; }
    .check {
      display: grid; place-items: center; width: 18px; height: 18px; flex: none; padding: 0;
      border: 1.5px solid #cbd1ca; border-radius: 6px; color: white; background: white;
    }
    .check:hover { border-color: var(--green); }
    .check.done { border-color: var(--green); background: var(--green); }
    .check svg { width: 12px; height: 12px; }
    .task-main { min-width: 0; flex: 1; }
    .task-name { display: block; max-width: 100%; overflow: hidden; margin: 0 0 5px; padding: 0; border: 0; color: var(--ink); background: transparent; font-size: 12px; font-weight: 650; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .task-name:focus-visible { outline: 2px solid #9db9a5; outline-offset: 2px; }
    .task-name.completed { color: #9ba19c; text-decoration: line-through; }
    .task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; }
    .task-tag, .status { display: inline-flex; align-items: center; padding: 4px 7px; border-radius: 5px; color: #64716a; background: #f1f3f0; font-size: 9px; font-weight: 650; }
    .task-tag.urgent { color: var(--red); background: var(--red-soft); }
    .task-tag.soon { color: var(--amber); background: var(--amber-soft); }
    .task-due { min-width: 70px; color: #727a74; font-size: 10px; text-align: right; }
    .empty { padding: 28px 16px; color: var(--muted); font-size: 12px; text-align: center; }
    .appointment { display: flex; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #f0f1ee; }
    .appointment:last-child { border-bottom: 0; }
    .date-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 42px; height: 45px; flex: none; border-radius: 8px; color: var(--green); background: var(--green-soft); }
    .date-tile b { font-size: 16px; line-height: 1.1; }
    .date-tile small { margin-top: 3px; font-size: 8px; font-weight: 700; text-transform: uppercase; }
    .appointment-info { min-width: 0; padding-top: 2px; }
    .appointment-info strong { display: block; margin-bottom: 4px; font-size: 11px; }
    .appointment-info small { display: block; color: var(--muted); font-size: 10px; }
    .house-service-list { padding: 0 18px; }
    .house-service-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid #f0f1ee; color: inherit; background: transparent; text-align: left; cursor: pointer; }
    .house-service-row:last-child { border-bottom: 0; }
    .house-service-row:hover .house-service-name { color: var(--green); }
    .house-service-row:focus-visible { outline: 2px solid #9db9a5; outline-offset: 2px; }
    .house-service-name { min-width: 0; font-size: 11px; font-weight: 650; }
    .house-service-name small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; font-weight: 400; }
    .house-service-partners { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; font-weight: 400; }
    .house-service-row .inspection-status-badge { flex: none; margin-top: 0; }
    .provider-card { display: flex; align-items: center; gap: 11px; padding: 13px 18px; }
    .provider-avatar { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 10px; color: #725637; background: #f2eadf; font-size: 10px; font-weight: 750; }
    .provider-info { flex: 1; }
    .provider-info strong { display: block; font-size: 11px; }
    .provider-info small { color: var(--muted); font-size: 9px; }
    .rating { color: #9b712c; font-size: 10px; font-weight: 700; }
    .provider-filters { display: flex; flex-wrap: wrap; gap: 9px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .provider-filters .search { flex: 1 1 210px; }
    .provider-filters .search input { width: 100%; }
    .provider-filters .search svg { top: 31px; }
    .provider-results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; padding: 16px; }
    .provider-result { position: relative; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .provider-result-top { display: flex; align-items: flex-start; gap: 10px; padding-right: 28px; }
    .provider-result .provider-avatar { width: 37px; height: 37px; }
    .provider-result h3 { margin: 1px 0 4px; font-size: 12px; }
    .provider-result p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .favorite-btn { display: grid; place-items: center; width: 29px; height: 29px; padding: 0; border: 1px solid var(--line); border-radius: 8px; color: #858c86; background: #fff; }
    .favorite-btn svg { width: 15px; height: 15px; }
    .assign-provider-btn { display: grid; place-items: center; width: 25px; height: 25px; flex: none; margin-left: 7px; padding: 0; border: 1px solid #cbd1ca; border-radius: 7px; color: #68746b; background: white; cursor: pointer; }
    .assign-provider-btn svg { width: 15px; height: 15px; }
    .assign-provider-btn.selected { border-color: var(--green); color: white; background: var(--green); }
    .assign-provider-btn:hover, .assign-provider-btn:focus-visible { outline: 2px solid #9db9a5; outline-offset: 2px; }
    .property-assigned-partners { margin: 9px 0 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .property-assigned-partners strong { color: var(--ink); font-size: 9px; }
    .favorite-btn.active { border-color: #f0dfd4; color: #bd694e; background: #fff5ef; }
    .provider-details { display: flex; flex-wrap: wrap; gap: 7px 11px; margin: 14px 0 12px; color: #626c64; font-size: 10px; }
    .provider-type { display: inline-block; padding: 4px 7px; border-radius: 5px; color: var(--green); background: var(--green-soft); font-size: 9px; font-weight: 700; }
    .provider-type.renovation { color: #805526; background: var(--amber-soft); }
    .provider-result-footer { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
    .provider-contact-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 10px; min-width: 0; }
    .provider-source { color: var(--green); font-size: 10px; font-weight: 700; text-decoration: none; }
    .provider-source:hover { text-decoration: underline; }
    .provider-specialty { color: #626c64; font-size: 9px; }
    .source-note { padding: 0 18px 14px; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .cost-summary { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(190px, .6fr); gap: 14px; margin: 17px 0; }
    .cost-total { padding: 20px; border-radius: 12px; color: #fff; background: var(--green); }
    .cost-total small { color: rgba(255,255,255,.76); font-size: 10px; }
    .cost-total strong { display: block; margin-top: 8px; font-size: 30px; letter-spacing: -1px; }
    .cost-total span { display: block; margin-top: 5px; color: rgba(255,255,255,.76); font-size: 10px; }
    .cost-average { display: flex; flex-direction: column; justify-content: center; padding: 18px; }
    .cost-average span { color: var(--muted); font-size: 10px; }
    .cost-average strong { margin-top: 7px; font-size: 21px; }
    .cost-list { padding: 0 18px; }
    .cost-item { display: flex; align-items: center; gap: 12px; min-height: 67px; border-bottom: 1px solid #f0f1ee; }
    .cost-item:last-child { border-bottom: 0; }
    .cost-item-main { min-width: 0; flex: 1; }
    .cost-item-main strong { display: block; margin-bottom: 4px; font-size: 11px; }
    .cost-item-main small { color: var(--muted); font-size: 9px; }
    .cost-input-wrap { display: flex; align-items: center; gap: 6px; }
    .cost-input { width: 116px; height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; text-align: right; font-size: 11px; }
    .cost-input-wrap span { color: var(--muted); font-size: 10px; }
    .cost-disclaimer { padding: 13px 18px; color: #745a35; background: #fffaf0; font-size: 10px; line-height: 1.6; }
    .checklist { padding: 4px 18px; }
    .checklist-item { display: flex; align-items: flex-start; gap: 11px; padding: 12px 0; border-bottom: 1px solid #f0f1ee; }
    .checklist-item:last-child { border-bottom: 0; }
    .checklist-item input { width: 16px; height: 16px; flex: none; margin: 2px 0 0; accent-color: var(--green); }
    .checklist-item strong { display: block; margin-bottom: 3px; font-size: 11px; }
    .checklist-item small { color: var(--muted); font-size: 10px; line-height: 1.5; }
    .inspection-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 15px; }
    .inspection-tab { min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; color: #626c64; background: white; font-size: 11px; font-weight: 650; }
    .inspection-tab.active { border-color: var(--green); color: var(--green); background: var(--green-soft); }
    .winter-progress { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 10px; }
    .winter-progress progress { width: 100px; height: 8px; accent-color: var(--green); }
    .inspection-settings { display: grid; grid-template-columns: minmax(180px, .7fr) minmax(0, 1.3fr); gap: 16px; padding: 17px 18px; }
    .inspection-settings-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
    .inspection-option { display: flex; align-items: flex-start; gap: 8px; color: var(--ink); font-size: 10px; line-height: 1.45; }
    .inspection-option input { flex: none; margin: 1px 0 0; accent-color: var(--green); }
    .inspection-completion-date { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); }
    .inspection-completion-date .form-label { margin: 0; }
    .inspection-completion-date input { max-width: 180px; }
    .inspection-history { padding: 12px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; line-height: 1.7; }
    .inspection-status { padding: 11px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .section-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 20px 0 13px; }
    .search { position: relative; min-width: 200px; }
    .search svg { position: absolute; top: 10px; left: 11px; width: 15px; height: 15px; color: #8b938c; }
    .search input, .filter-select { height: 36px; border: 1px solid var(--line); border-radius: 8px; outline: none; color: var(--ink); background: white; font-size: 11px; }
    .search input { width: min(270px, 35vw); padding: 0 10px 0 33px; }
    .search input:focus, .filter-select:focus, .form-control:focus { border-color: #8ca897; box-shadow: 0 0 0 3px rgba(40, 92, 69, .08); }
    .filter-select { padding: 0 28px 0 10px; }
    .property-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .property-card { padding: 18px; }
    .property-card[data-action="view-property"] { cursor: pointer; transition: border-color .18s, box-shadow .18s; }
    .property-card[data-action="view-property"]:hover, .property-card[data-action="view-property"]:focus-visible { border-color: #b8c8ba; box-shadow: 0 5px 18px rgba(40, 73, 51, .08); outline: none; }
    .remove-property-section { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 22px; padding: 17px 19px; border: 1px solid #ead7d3; border-radius: 11px; background: #fffaf9; }
    .remove-property-section strong { display: block; font-size: 11px; }
    .remove-property-section p { margin: 5px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .danger-btn { flex: none; padding: 9px 12px; border: 1px solid #c98276; border-radius: 7px; color: #963e32; background: white; font-size: 10px; font-weight: 700; }
    .danger-btn:hover { color: white; background: #a84437; border-color: #a84437; }
    .property-card strong { font-size: 10px; line-height: 1.45; }
    .property-photo { display: block; width: 100%; max-height: 240px; margin-bottom: 14px; border-radius: 9px; object-fit: cover; }
    .property-card-photo { width: 100%; height: 150px; margin: -2px 0 12px; border-radius: 8px; object-fit: cover; }
    .photo-preview { display: none; width: min(100%, 320px); max-height: 180px; margin-top: 10px; border-radius: 8px; object-fit: cover; }
    .photo-preview.visible { display: block; }
    .property-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .property-symbol { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 11px; color: var(--green); background: var(--green-soft); }
    .property-symbol svg { width: 19px; height: 19px; }
    .property-card h3 { margin: 15px 0 4px; font-size: 14px; }

    function compressPropertyPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Bilddatei konnte nicht gelesen werden.'));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error('Die ausgewählte Datei ist kein lesbares Bild.'));
          image.onload = () => {
            const maxEdge = 1200;
            const scale = Math.min(1, maxEdge / Math.max(image.naturalWidth, image.naturalHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(image.naturalWidth * scale);
            canvas.height = Math.round(image.naturalHeight * scale);
            canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.78));
          };
          image.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      });
    }

        'stugliv-inspection-cadence': nextInspectionCadence,

      };
      const previousValues = Object.fromEntries(Object.keys(updates).map((key) => [key, localStorage.getItem(key)]));

        for (const [key, value] of Object.entries(updates)) localStorage.setItem(key, JSON.stringify(value));

            console.error(`Wiederherstellung von ${key} fehlgeschlagen:`, rollbackError);
          }
        }
        showToast('Haus konnte nicht vollständig entfernt werden. Browser-Speicher prüfen.');
        return false;
      }
      properties = nextProperties;
      tasks = nextTasks;
      annualCosts = nextCosts;
      inspectionChecks = nextInspectionChecks;
      inspectionLog = nextInspectionLog;
      inspectionSelections = nextInspectionSelections;

    function renderNotifications() {

      const priority = { urgent: 0, soon: 1, normal: 2 };
      const today = localDateKey(new Date());
      const mostUrgent = [...openTasks].sort((a, b) => {
        const priorityDifference = (priority[a.priority] ?? 2) - (priority[b.priority] ?? 2);
        if (priorityDifference) return priorityDifference;
        const dateA = a.date || '9999-12-31';
        const dateB = b.date || '9999-12-31';
        const overdueDifference = Number(dateA > today) - Number(dateB > today);
        return overdueDifference || dateA.localeCompare(dateB);
      }).slice(0, 3);
      const urgentCount = openTasks.filter((task) => task.priority === 'urgent').length;
      document.querySelector('#notify-button .dot').hidden = openTasks.length === 0;
      panel.innerHTML = `<div class="notification-head"><div><strong>Dringendste Aufgaben</strong><small>${openTasks.length ? `${openTasks.length} offene Aufgaben · nach Priorität sortiert` : 'Alle Aufgaben sind erledigt.'}</small></div>${urgentCount ? `<span class="notification-count">${urgentCount} dringend</span>` : ''}</div>

    function calendarPage() {
      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();
      const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
      const selectedDate = new Date(`${calendarSelectedDate}T12:00:00`);
      const weekStart = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), 12);
      weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));
      const weekEnd = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 6, 12);
      const monthTitle = calendarView === 'week'
        ? `${new Intl.DateTimeFormat('de-DE', { day: 'numeric', month: 'short' }).format(weekStart)} – ${new Intl.DateTimeFormat('de-DE', { day: 'numeric', month: 'short', year: 'numeric' }).format(weekEnd)}`
        : new Intl.DateTimeFormat('de-DE', { month: 'long', year: 'numeric' }).format(calendarMonth);
      const today = new Date();
      const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      const events = calendarEvents();
      const selectedEvents = events.filter((item) => item.date === calendarSelectedDate).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
      const weekdayLabels = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
      const cells = [];
      const cellCount = calendarView === 'week' ? 7 : 42;
      for (let index = 0; index < cellCount; index++) {
        const dayDate = calendarView === 'week'
          ? new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + index, 12)
          : new Date(year, month, index - firstWeekday + 1);
        const dateKey = `${dayDate.getFullYear()}-${String(dayDate.getMonth() + 1).padStart(2, '0')}-${String(dayDate.getDate()).padStart(2, '0')}`;
        const dayEvents = events.filter((item) => item.date === dateKey);
        const maxVisible = calendarView === 'week' ? 5 : 2;
        const eventChips = dayEvents.slice(0, maxVisible).map((item) => {
          const label = `${escapeHtml(item.time ? `${item.time} ` : '')}${escapeHtml(item.title)}`;
          return item.type === 'task'
            ? `<button type="button" class="calendar-event-chip task" data-edit-task="${item.taskId}" aria-label="Aufgabe bearbeiten: ${escapeHtml(item.title)}">${label}</button>`
            : `<span class="calendar-event-chip">${label}</span>`;
        }).join('');
        const moreEvents = dayEvents.length > maxVisible ? `<span class="calendar-event-chip">+${dayEvents.length - maxVisible} weitere</span>` : '';
        cells.push(`<div class="calendar-day ${calendarView === 'month' && dayDate.getMonth() !== month ? 'outside' : ''} ${dateKey === calendarSelectedDate ? 'selected' : ''} ${dateKey === todayKey ? 'today' : ''}" data-calendar-date="${dateKey}"><button type="button" class="calendar-date-button" data-calendar-date="${dateKey}" aria-label="${escapeHtml(new Intl.DateTimeFormat('de-DE', { dateStyle: 'full' }).format(dayDate))}${dayEvents.length ? `, ${dayEvents.length} Termine` : ''}" aria-pressed="${dateKey === calendarSelectedDate}"><span class="calendar-day-number">${dayDate.getDate()}</span></button>${eventChips}${moreEvents}</div>`);
      }
      const selectedLabel = new Intl.DateTimeFormat('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(`${calendarSelectedDate}T12:00:00`));
      return `<div class="welcome"><div><p class="eyebrow">Planung & Gästewechsel</p><h1>Kalender</h1><p class="subtitle">Gästewechsel und datierte Serviceaufgaben im Monatsüberblick.</p></div></div>
        <section class="card"><div class="card-head"><h2 class="card-title">Termine</h2><div class="calendar-toolbar"><button class="calendar-nav" data-calendar-step="-1" aria-label="${calendarView === 'week' ? 'Vorherige Woche' : 'Vorheriger Monat'}">‹</button><strong>${escapeHtml(monthTitle)}</strong><button class="calendar-nav" data-calendar-step="1" aria-label="${calendarView === 'week' ? 'Nächste Woche' : 'Nächster Monat'}">›</button><div class="calendar-view-toggle" aria-label="Kalenderansicht"><button type="button" data-calendar-view="month" class="${calendarView === 'month' ? 'active' : ''}" aria-pressed="${calendarView === 'month'}">Monat</button><button type="button" data-calendar-view="week" class="${calendarView === 'week' ? 'active' : ''}" aria-pressed="${calendarView === 'week'}">Woche</button></div></div></div>
          <div class="calendar-grid ${calendarView === 'week' ? 'calendar-week-view' : ''}">${weekdayLabels.map((label) => `<div class="calendar-weekday">${label}</div>`).join('')}${cells.join('')}</div>
          <div class="calendar-legend"><span><i class="calendar-dot"></i>Gästewechsel</span><span><i class="calendar-dot task"></i>Serviceaufgabe</span></div>
        </section>
        <section class="card" style="margin-top:16px"><div class="card-head"><div><h2 class="card-title">${escapeHtml(selectedLabel)}</h2><p class="card-caption">${selectedEvents.length} ${selectedEvents.length === 1 ? 'Termin' : 'Termine'}</p></div><button class="text-btn" data-page="tasks">Aufgaben ansehen →</button></div>

            const eventDetails = `<span class="calendar-event-time">${escapeHtml(item.time || (item.type === 'task' ? 'Aufgabe' : ''))}</span><span><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.property)} · ${escapeHtml(item.detail)}</small></span>`;

              : `<div class="calendar-event">${eventDetails}</div>`;
          }).join('') : '<div class="empty">Für diesen Tag sind keine Termine eingetragen.</div>'}
        </section>`;
    }

          ${selectedItems.length ? `<div class="checklist">${selectedItems.map((item) => `<label class="checklist-item"><input type="checkbox" data-inspection-check="${item.id}" ${checks[item.id] ? 'checked' : ''}><span><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.detail)}</small></span></label>`).join('')}</div>` : '<div class="empty">Wähle oben mindestens einen Prüfpunkt für dieses Haus aus.</div>'}
          <div class="inspection-completion-date"><label class="form-label" for="inspection-completed-date">Tatsächlich durchgeführt am</label><input class="form-control" id="inspection-completed-date" type="date" max="${today}" value="${today}" ${!selectedItems.length || complete < selectedItems.length ? 'disabled' : ''}></div>
          <div class="inspection-status">Bei akuter Gefahr, Wasserschaden oder Einbruch: Abstand halten und Eigentümer bzw. zuständigen Notdienst informieren. Die Prüfliste ist eine organisatorische Hilfe und ersetzt keine fachgerechte Prüfung.</div>
          ${entries.length ? `<div class="inspection-history"><strong>Protokollierte Termine:</strong> ${entries.slice().reverse().map((entry) => escapeHtml(formatInspectionDate(entry.date))).join(' · ')}</div>` : ''}

    function persistInspectionData() {
      try {
        localStorage.setItem('stugliv-inspection-checks', JSON.stringify(inspectionChecks));
        localStorage.setItem('stugliv-inspection-log', JSON.stringify(inspectionLog));
        localStorage.setItem('stugliv-inspection-selections', JSON.stringify(inspectionSelections));
        localStorage.setItem('stugliv-inspection-cadence', JSON.stringify(inspectionCadence));
      } catch (error) {
        console.error('Hauskontroll-Daten konnten nicht gespeichert werden:', error);
        showToast('Kontrolle konnte nicht gespeichert werden. Browser-Speicher prüfen.');
      }
    }
    function persistWinterChecks() {
      try {
        localStorage.setItem('stugliv-winter-checklist', JSON.stringify(winterChecks));
        return true;
      } catch (error) {
        console.error('Winter-Checkliste konnte nicht gespeichert werden:', error);
        showToast('Winter-Checkliste konnte nicht gespeichert werden. Browser-Speicher prüfen.');
        return false;
      }
    }
    function finishInspection() {
      const checks = inspectionChecks[inspectionProperty] || {};
      const selectedIds = Array.isArray(inspectionSelections[inspectionProperty]) ? inspectionSelections[inspectionProperty] : absenceChecklist.map((item) => item.id);
      const selectedItems = absenceChecklist.filter((item) => selectedIds.includes(item.id));
      const completedDate = document.getElementById('inspection-completed-date')?.value;
      if (!selectedItems.length) {
        showToast('Bitte erst Prüfpunkte für dieses Haus auswählen.');
        return;
      }
      if (selectedItems.some((item) => !checks[item.id])) {
        showToast('Bitte erst alle ausgewählten Prüfpunkte abhaken.');
        return;
      }
      if (!completedDate || completedDate > localDateKey(new Date())) {
        showToast('Bitte ein gültiges Datum der durchgeführten Kontrolle eintragen.');
        return;
      }
      const entries = inspectionLogEntries(inspectionProperty);
      entries.push({ date: completedDate, completedAt: new Date().toISOString(), checkedItems: selectedIds.slice() });
      inspectionLog[inspectionProperty] = entries;
      inspectionChecks[inspectionProperty] = {};
      persistInspectionData();
      render();
      showToast('Hauskontrolle wurde mit Datum protokolliert.');
    }
    function localDateKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    function formatInspectionDate(date) {
      return new Intl.DateTimeFormat('de-DE', { dateStyle: 'medium' }).format(new Date(`${date}T12:00:00`));
    }
    function inspectionLogEntries(propertyId) {
      const log = inspectionLog[propertyId];
      if (Array.isArray(log)) return log
        .filter((entry) => entry && /^\d{4}-\d{2}-\d{2}$/.test(entry.date))
        .map((entry) => ({
          ...entry,
          checkedItems: Array.isArray(entry.checkedItems) ? entry.checkedItems : absenceChecklist.map((item) => item.id)
        }));
      if (typeof log === 'string' && !Number.isNaN(Date.parse(log))) {
        return [{ date: log.slice(0, 10), completedAt: log, checkedItems: absenceChecklist.map((item) => item.id) }];
      }
      return [];
    }
    function inspectionIsCurrent(propertyId) {
      const selectedIds = Array.isArray(inspectionSelections[propertyId])
        ? inspectionSelections[propertyId]
        : absenceChecklist.map((item) => item.id);
      if (!selectedIds.length) return false;
      const checks = inspectionChecks[propertyId] || {};
      if (selectedIds.every((id) => checks[id])) return true;
      const latest = inspectionLogEntries(propertyId)
        .filter((entry) => selectedIds.every((id) => entry.checkedItems.includes(id)))
        .sort((a, b) => b.date.localeCompare(a.date))[0];
      if (!latest || latest.date > localDateKey(new Date())) return false;
      const lastCompleted = new Date(`${latest.date}T12:00:00`);
      const dueDate = new Date(lastCompleted);
      if (inspectionCadence[propertyId] === 'weekly') {
        dueDate.setDate(dueDate.getDate() + 7);
      } else {
        const originalDay = dueDate.getDate();
        dueDate.setDate(1);
        dueDate.setMonth(dueDate.getMonth() + 1);
        const lastDayOfDueMonth = new Date(dueDate.getFullYear(), dueDate.getMonth() + 1, 0).getDate();
        dueDate.setDate(Math.min(originalDay, lastDayOfDueMonth));
      }
      return new Date(`${localDateKey(new Date())}T12:00:00`) <= dueDate;
    }
    function inspectionStatusBadge(propertyId) {
      return inspectionIsCurrent(propertyId)
        ? `<span class="inspection-status-badge current">${icon('check')}Hauskontrolle aktuell</span>`
        : '<span class="inspection-status-badge">Hauskontrolle fällig</span>';
    }
    function render() {
      const pages = { dashboard, tasks: tasksPage, properties: propertiesPage, propertyDetail: propertyDetailPage, providers: providersPage, costs: costsPage, inspections: inspectionsPage, calendar: calendarPage, profile: profilePage };
      const labels = { dashboard: 'Übersicht', tasks: 'Serviceaufgaben', properties: 'Ferienhäuser', propertyDetail: 'Objektübersicht', providers: 'Servicepartner', costs: 'Jahreskosten', inspections: 'Hauskontrolle', calendar: 'Kalender', profile: 'Benutzer' };

      updateProfileSummary();
      pageContent.innerHTML = pages[currentPage]();
      renderNotifications();

    function toggleTask(id) {
      const task = tasks.find((item) => item.id === Number(id));

    document.addEventListener('click', (event) => {

        document.getElementById('notify-button').setAttribute('aria-expanded', 'false');

      const menuToggle = event.target.closest('#menu-toggle');
      const menu = document.getElementById('main-menu');

        const isOpen = menu.classList.toggle('open');

      }

        inspectionView = inspectionViewButton.dataset.inspectionView;

          calendarMonth = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
        } else {
          calendarMonth.setDate(1);
          calendarMonth.setMonth(calendarMonth.getMonth() + step);
          calendarSelectedDate = `${calendarMonth.getFullYear()}-${String(calendarMonth.getMonth() + 1).padStart(2, '0')}-01`;
        }
        render();
        return;
      }
      const calendarMonthButton = event.target.closest('[data-calendar-month]');
      if (calendarMonthButton) {
        calendarMonth.setMonth(calendarMonth.getMonth() + Number(calendarMonthButton.dataset.calendarMonth));
        calendarSelectedDate = `${calendarMonth.getFullYear()}-${String(calendarMonth.getMonth() + 1).padStart(2, '0')}-01`;
        render();
        return;
      }
      const taskToEdit = event.target.closest('[data-edit-task]');
      if (taskToEdit) {
        const task = tasks.find((item) => item.id === Number(taskToEdit.dataset.editTask));
        if (task) openTaskEditor(task);
        return;
      }
      const calendarDayButton = event.target.closest('[data-calendar-date]');
      if (calendarDayButton) {
        calendarSelectedDate = calendarDayButton.dataset.calendarDate;
        calendarMonth = new Date(`${calendarSelectedDate.slice(0, 7)}-01T12:00:00`);
        render();
        return;
      }
      const toggle = event.target.closest('[data-toggle]');
      if (toggle) { toggleTask(toggle.dataset.toggle); return; }
      const favoriteButton = event.target.closest('[data-favorite]');
      if (favoriteButton) {
        const id = favoriteButton.dataset.favorite;
        favorites = favorites.includes(id) ? favorites.filter((favorite) => favorite !== id) : [...favorites, id];
        try { localStorage.setItem('stugliv-favorites', JSON.stringify(favorites)); }
        catch (error) { console.error('Favoriten konnten nicht gespeichert werden:', error); showToast('Favorit konnte nicht gespeichert werden.'); }
        render();
        return;
      }
      const pageButton = event.target.closest('[data-page]');
      if (pageButton) {
        currentPage = pageButton.dataset.page;
        menu.classList.remove('open');
        toggleButton.setAttribute('aria-expanded', 'false');
        toggleButton.setAttribute('aria-label', 'Menü öffnen');

        document.getElementById('notify-button').setAttribute('aria-expanded', 'false');
        render();
        return;
      }
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (action === 'new-task') openTaskModal();
      if (action === 'finish-inspection') finishInspection();
      if (action === 'open-inspection') {

        currentPage = 'inspections';
        render();

      if (action === 'find-inspectors') {

        providerCategory = 'house';

      if (action === 'find-providers') {
        providerProperty = event.target.closest('[data-action]').dataset.property;
        currentPage = 'providers';
        render();
      }
      if (action === 'toggle-provider-assignment') {
        const button = event.target.closest('[data-action]');
        const { property: propertyId, provider: providerId } = button.dataset;
        const currentAssignments = servicePartnerAssignments[propertyId] || [];
        const isAssigned = currentAssignments.includes(providerId);
        const nextMapping = {
          ...servicePartnerAssignments,

            : [...currentAssignments, providerId]
        };
        try {
          localStorage.setItem('stugliv-provider-assignments', JSON.stringify(nextMapping));
          servicePartnerAssignments = nextMapping;
          render();
          showToast(isAssigned ? 'Servicepartner-Zuordnung entfernt.' : 'Servicepartner dem Ferienhaus zugeordnet.');
        } catch (error) {
          console.error('Servicepartner-Zuordnung konnte nicht gespeichert werden:', error);
          showToast('Zuordnung konnte nicht gespeichert werden. Browser-Speicher prüfen.');
        }
        return;
      }
      if (action === 'add-property') openPropertyModal();
      if (action === 'edit-property') {
        const property = properties.find((item) => item.id === event.target.closest('[data-action]').dataset.property);
        if (property) openPropertyModal(property);
      }
      if (action === 'remove-property') {
        const property = properties.find((item) => item.id === event.target.closest('[data-action]').dataset.property);
        if (property && window.confirm(`Möchtest du „${property.name}“ wirklich entfernen? Zugehörige Aufgaben, Kosten und Hauskontrolldaten werden ebenfalls gelöscht.`)) {
          removeProperty(property.id);
        }
      }
      if (action === 'remove-property-photo') {
        pendingPropertyPhoto = '';
        const preview = document.getElementById('property-photo-preview');
        preview.removeAttribute('src');
        preview.classList.remove('visible');
        document.getElementById('remove-property-photo').style.display = 'none';
      }
      if (action === 'view-property') {
        selectedPropertyId = event.target.closest('[data-action]').dataset.property;
        currentPage = 'propertyDetail';
        render();
      }
      if (action === 'toggle-favorites') { onlyFavorites = !onlyFavorites; render(); }
      if (action === 'add-provider') showToast('Einladungen sind bald verfügbar.');
    });
    document.addEventListener('keydown', (event) => {
      const propertyCard = event.target.closest('.property-card[data-action="view-property"]');
      if (propertyCard && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        propertyCard.click();
      }
    });
    pageContent.addEventListener('input', (event) => {
      if (event.target.id === 'task-search') {
        const cursor = event.target.selectionStart;
        searchTerm = event.target.value;
        render();
        const input = document.getElementById('task-search');
        input.focus();
        input.setSelectionRange(cursor, cursor);
      }
      if (event.target.id === 'provider-search') {
        providerSearch = event.target.value;
        render();
        const input = document.getElementById('provider-search');
        input.focus();
        input.setSelectionRange(providerSearch.length, providerSearch.length);
      }
      if (event.target.matches('[data-cost]')) {
        const costs = annualCosts[costProperty] || (annualCosts[costProperty] = { ...initialCosts[costProperty] });
        costs[event.target.dataset.cost] = Math.max(0, Number(event.target.value) || 0);
        const total = costCategories.reduce((sum, category) => sum + (Number(costs[category.id]) || 0), 0);
        const money = (amount) => new Intl.NumberFormat('sv-SE', { maximumFractionDigits: 0 }).format(amount) + ' kr';
        document.getElementById('annual-total').textContent = money(total);
        document.getElementById('monthly-total').textContent = money(Math.round(total / 12));
      }
    });
    pageContent.addEventListener('change', (event) => {
      if (event.target.id === 'task-filter') { taskFilter = event.target.value; render(); }
      if (event.target.id === 'provider-property') { providerProperty = event.target.value; render(); }
      if (event.target.id === 'provider-category') { providerCategory = event.target.value; render(); }
      if (event.target.id === 'provider-radius') { providerRadius = Number(event.target.value); render(); }
      if (event.target.id === 'cost-property') { costProperty = event.target.value; render(); }
      if (event.target.id === 'inspection-property') { inspectionProperty = event.target.value; render(); }
      if (event.target.id === 'inspection-cadence') {
        inspectionCadence[inspectionProperty] = event.target.value;
        persistInspectionData();
        render();
        return;
      }
      if (event.target.matches('[data-inspection-select]')) {
        const selectedIds = Array.isArray(inspectionSelections[inspectionProperty])
          ? inspectionSelections[inspectionProperty]
          : absenceChecklist.map((item) => item.id);
        const itemId = event.target.dataset.inspectionSelect;
        inspectionSelections[inspectionProperty] = event.target.checked
          ? [...new Set([...selectedIds, itemId])]
          : selectedIds.filter((id) => id !== itemId);
        if (!event.target.checked && inspectionChecks[inspectionProperty]) {
          delete inspectionChecks[inspectionProperty][itemId];
        }
        persistInspectionData();
        render();
        return;
      }
      if (event.target.matches('[data-cost]')) {
        try { localStorage.setItem('stugliv-costs', JSON.stringify(annualCosts)); }
        catch (error) { console.error('Jahreskosten konnten nicht gespeichert werden:', error); showToast('Kosten konnten nicht gespeichert werden.'); }
      }
      if (event.target.matches('[data-inspection-check]')) {
        const checks = inspectionChecks[inspectionProperty] || (inspectionChecks[inspectionProperty] = {});
        checks[event.target.dataset.inspectionCheck] = event.target.checked;
        persistInspectionData();
        render();
      }
      if (event.target.matches('[data-winter-check]')) {
        const winterKey = `${new Date().getFullYear()}:${inspectionProperty}`;
        const previousChecks = winterChecks[winterKey] || {};
        winterChecks = {
          ...winterChecks,
          [winterKey]: { ...previousChecks, [event.target.dataset.winterCheck]: event.target.checked }
        };
        if (!persistWinterChecks()) winterChecks[winterKey] = previousChecks;
        render();
      }
    });
    document.getElementById('property-form').addEventListener('change', async (event) => {
      if (event.target.name !== 'photo') return;
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Bitte eine Bilddatei auswählen.');
        event.target.value = '';
        return;
      }
      try {
        pendingPropertyPhoto = await compressPropertyPhoto(file);
        const preview = document.getElementById('property-photo-preview');
        preview.src = pendingPropertyPhoto;
        preview.classList.add('visible');
        document.getElementById('remove-property-photo').style.display = 'inline';
      } catch (error) {
        console.error('Hausfoto konnte nicht verarbeitet werden:', error);
        showToast('Hausfoto konnte nicht geladen werden.');
      }
    });
    document.getElementById('property-form').addEventListener('click', (event) => {
      if (event.target.id === 'remove-property-photo') {
        pendingPropertyPhoto = '';
        const preview = document.getElementById('property-photo-preview');
        preview.removeAttribute('src');
        preview.classList.remove('visible');
        document.getElementById('remove-property-photo').style.display = 'none';
        document.querySelector('#property-form [name="photo"]').value = '';
      }
    });
    pageContent.addEventListener('submit', (event) => {
      if (event.target.id !== 'profile-form') return;
      event.preventDefault();
      const formData = new FormData(event.target);
      const updatedProfile = {
        name: String(formData.get('name')).trim(),
        username: String(formData.get('username')).trim(),
        email: String(formData.get('email')).trim()
      };
      try {
        localStorage.setItem('stugliv-profile', JSON.stringify(updatedProfile));
        profileData = updatedProfile;
        render();
        showToast('Profil wurde gespeichert.');
      } catch (error) {
        console.error('Profil konnte nicht gespeichert werden:', error);
        showToast('Profil konnte nicht gespeichert werden. Browser-Speicher prüfen.');
      }
    });
    document.getElementById('task-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const formData = new FormData(event.currentTarget);
      const isEditing = editingTaskId !== null;
      const previousTasks = tasks;
      const updatedTask = {
        ...(isEditing ? tasks.find((task) => task.id === editingTaskId) : {}),
        id: isEditing ? editingTaskId : Date.now(),
        title: String(formData.get('title')).trim(),
        property: String(formData.get('property')),
        date: String(formData.get('date')),
        priority: String(formData.get('priority')),
        done: isEditing ? tasks.find((task) => task.id === editingTaskId)?.done ?? false : false
      };
      if (isEditing && !tasks.some((task) => task.id === editingTaskId)) {
        showToast('Diese Aufgabe wurde nicht gefunden und konnte nicht bearbeitet werden.');
        closeTaskModal();
        return;
      }
      tasks = isEditing
        ? tasks.map((task) => task.id === editingTaskId ? updatedTask : task)
        : [...tasks, updatedTask];
      if (!persistTasks()) {
        tasks = previousTasks;
        return;
      }
      closeTaskModal();
      event.currentTarget.reset();
      if (!isEditing) currentPage = 'tasks';
      render();
      showToast(isEditing ? 'Aufgabe wurde aktualisiert.' : 'Neue Aufgabe wurde gespeichert.');
    });
    document.getElementById('property-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const formData = new FormData(form);
      const previous = editingPropertyId ? properties.find((property) => property.id === editingPropertyId) : null;
      const photoFile = form.elements.photo.files?.[0];
      if (photoFile && !pendingPropertyPhoto) {
        try {
          pendingPropertyPhoto = await compressPropertyPhoto(photoFile);
        } catch (error) {
          console.error('Hausfoto konnte nicht verarbeitet werden:', error);
          showToast('Hausfoto konnte nicht verarbeitet werden. Bitte erneut auswählen oder entfernen.');
          return;
        }
      }
      const property = propertyWithDefaults({
        ...(previous || {}),
        id: previous?.id || `property-${Date.now()}`,
        name: String(formData.get('name')).trim(),
        address: String(formData.get('address')).trim(),
        region: String(formData.get('region')).trim(),
        yearBuilt: String(formData.get('yearBuilt')).trim(),
        livingArea: String(formData.get('livingArea')).trim(),
        plotSize: String(formData.get('plotSize')).trim(),
        rooms: String(formData.get('rooms')).trim(),
        beds: formData.get('beds') ? `${String(formData.get('beds')).trim()} Schlafplätze` : '',
        heatingSystem: String(formData.get('heatingSystem') || ''),
        heatingYear: String(formData.get('heatingYear') || '').trim(),
        fireplace: String(formData.get('fireplace') || ''),
        fireplaceType: String(formData.get('fireplaceType') || ''),
        fireplaceInspection: String(formData.get('fireplaceInspection') || ''),
        fireplaceNotes: String(formData.get('fireplaceNotes') || '').trim(),
        photo: pendingPropertyPhoto,
        condition: String(formData.get('condition')),
        lastRenovations: String(formData.get('lastRenovations')).trim(),
        plannedRenovations: String(formData.get('plannedRenovations')).trim()
      });
      const index = properties.findIndex((item) => item.id === property.id);
      if (index === -1) properties.push(property);
      else properties[index] = property;
      if (!initialCosts[property.id]) initialCosts[property.id] = Object.fromEntries(costCategories.map((category) => [category.id, category.amount]));
      annualCosts[property.id] ||= { ...initialCosts[property.id] };
      selectedPropertyId = property.id;
      if (!saveProperties()) {
        if (previous) properties[index] = previous;
        else properties = properties.filter((item) => item.id !== property.id);
        return;
      }
      closePropertyModal();
      currentPage = 'propertyDetail';
      render();
      showToast(previous ? 'Ferienhausdaten wurden aktualisiert.' : 'Ferienhaus wurde angelegt.');
    });
    document.getElementById('close-modal').addEventListener('click', closeTaskModal);
    document.getElementById('cancel-modal').addEventListener('click', closeTaskModal);
    document.getElementById('close-property-modal').addEventListener('click', closePropertyModal);
    document.getElementById('cancel-property-modal').addEventListener('click', closePropertyModal);
    document.getElementById('property-modal').addEventListener('click', (event) => {
      if (event.target.id === 'property-modal') closePropertyModal();
    });
    document.getElementById('task-modal').addEventListener('click', (event) => {
      if (event.target.id === 'task-modal') closeTaskModal();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeTaskModal();
        closePropertyModal();
      }
    });
    document.getElementById('notify-button').addEventListener('click', () => showToast('Du bist auf dem neuesten Stand.'));
    document.getElementById('settings-button').addEventListener('click', () => { currentPage = 'profile'; render(); });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        const menu = document.getElementById('main-menu');
        const toggleButton = document.getElementById('menu-toggle');
        menu.classList.remove('open');
        toggleButton.setAttribute('aria-expanded', 'false');
        toggleButton.setAttribute('aria-label', 'Menü öffnen');
        document.getElementById('notification-panel').classList.remove('open');
        document.getElementById('notify-button').setAttribute('aria-expanded', 'false');
      }
    });
    render();
  </script>
</body>
</html>
